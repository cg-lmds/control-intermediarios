<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Corporativo de Intermediarios</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Mantén tus dependencias de DataTables y estilos aquí -->
</head>
<body class="min-h-screen flex flex-col bg-slate-50">

  <!-- AQUÍ VA TU HTML EXISTENTE DEL NAVBAR Y TABLAS -->

  <!-- MODAL MEJORADO: NUEVO INTERMEDIARIO -->
  <div id="modal-maestro-overlay" class="hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-[2px] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6">
      <h3 class="text-lg font-semibold text-slate-900 mb-4">Intermediario (Control)</h3>
      
      <form id="maestro-form" class="space-y-4">
        
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
          <div class="sm:col-span-1">
            <label class="block text-xs font-medium text-slate-700">ID (Auto)</label>
            <input id="form-m-id" type="text" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-sm text-slate-500 font-mono" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-medium text-slate-700">Código *</label>
            <input id="form-m-cod" type="text" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm uppercase" />
          </div>
          <div class="sm:col-span-1">
            <label class="block text-xs font-medium text-slate-700">Activo</label>
            <select id="form-m-activo" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
              <option value="SI">SI</option>
              <option value="NO">NO</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700">Nombre del Intermediario *</label>
          <input id="form-m-intermediario" type="text" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        </div>

        <!-- LISTAS DESPLEGABLES CONECTADAS A LA HOJA CONTROL -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700">Ejecutivo *</label>
            <select id="form-m-ejecutivo" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">Sucursal *</label>
            <select id="form-m-sucursal" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">Líder</label>
            <select id="form-m-lider" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></select>
          </div>
        </div>

        <!-- CONSTRUCTOR DE CÉDULA Y CORREO -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-200 pt-4">
          
          <!-- Constructor de Cédula/RIF -->
          <div>
            <label class="block text-xs font-medium text-slate-700">Cédula / RIF</label>
            <div class="flex gap-2">
              <select id="form-m-cedula-tipo" class="w-20 px-2 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50">
                <option value="V-">V-</option>
                <option value="E-">E-</option>
                <option value="J-">J-</option>
                <option value="G-">G-</option>
              </select>
              <input id="form-m-cedula-num" type="text" placeholder="12345678" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono" />
            </div>
          </div>

          <!-- Constructor de Correo Inteligente -->
          <div>
            <label class="block text-xs font-medium text-slate-700">Correo Electrónico</label>
            <div class="flex gap-2">
              <input id="form-m-correo-user" type="text" placeholder="usuario" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm" />
              <select id="form-m-correo-domain" class="w-36 px-2 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50" onchange="toggleCorreoCustom()">
                <option value="@gmail.com">@gmail.com</option>
                <option value="@hotmail.com">@hotmail.com</option>
                <option value="@outlook.com">@outlook.com</option>
                <option value="@yahoo.com">@yahoo.com</option>
                <option value="custom">Personalizado...</option>
              </select>
            </div>
            <!-- Campo oculto para dominio de empresa -->
            <input id="form-m-correo-custom" type="text" placeholder="@empresa.com" class="hidden w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 border-t border-slate-200 pt-4">
          <div>
            <label class="block text-xs font-medium text-slate-700">Fecha Inicio *</label>
            <input id="form-m-fechainicio" type="date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">Fecha Fin (Libera al ejecutivo)</label>
            <input id="form-m-fechafin" type="date" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-orange-50 text-orange-900 border-orange-200" />
          </div>
        </div>
        
        <div id="form-m-error" class="hidden text-xs text-red-600 bg-red-50 p-2 rounded"></div>

        <div class="flex justify-end gap-2 pt-4">
          <button type="button" id="btn-cerrar-modal" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium">Guardar en Sistema</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. COLOCA AQUÍ LA URL DE TU SCRIPT DE GOOGLE UNA VEZ DESPLEGADO COMO WEB APP
    const API_URL = "https://script.google.com/macros/s/TU_ID_DE_DESPLIEGUE/exec";

    // Función universal para comunicarse con Google Apps Script
    async function apiCall(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action, payload })
        });
        return await response.json();
      } catch (error) {
        throw new Error("Error de red al conectar con Google Sheets.");
      }
    }

    // Lógica visual del correo personalizado
    function toggleCorreoCustom() {
      const select = document.getElementById('form-m-correo-domain');
      const customInput = document.getElementById('form-m-correo-custom');
      if (select.value === 'custom') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
      }
    }

    // Armar los datos al enviar el formulario
    document.getElementById('maestro-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errBox = document.getElementById('form-m-error');
      errBox.classList.add('hidden');

      // Ensamblar la cédula
      const cedTipo = document.getElementById('form-m-cedula-tipo').value;
      const cedNum = document.getElementById('form-m-cedula-num').value.trim();
      const cedulaFinal = cedNum ? (cedTipo + cedNum) : "";

      // Ensamblar el correo
      const correoUser = document.getElementById('form-m-correo-user').value.trim();
      const correoDomain = document.getElementById('form-m-correo-domain').value;
      let correoFinal = "";
      if (correoUser) {
        correoFinal = correoUser + (correoDomain === 'custom' ? document.getElementById('form-m-correo-custom').value.trim() : correoDomain);
      }

      const payload = {
        id: document.getElementById('form-m-id').value,
        cod: document.getElementById('form-m-cod').value,
        intermediario: document.getElementById('form-m-intermediario').value,
        ejecutivo: document.getElementById('form-m-ejecutivo').value,
        sucursal: document.getElementById('form-m-sucursal').value,
        lider: document.getElementById('form-m-lider').value,
        cedula: cedulaFinal,
        correo: correoFinal,
        fechaInicio: document.getElementById('form-m-fechainicio').value,
        fechaFin: document.getElementById('form-m-fechafin').value,
        activo: document.getElementById('form-m-activo').value
      };

      try {
        const respuesta = await apiCall('guardarIntermediarioMaestro', payload);
        if (respuesta.exito) {
          alert("Guardado correctamente");
          // Aquí recargas la tabla DataTables
        } else {
          errBox.textContent = respuesta.mensaje; // Aquí se mostrará el bloqueo de Fecha Fin
          errBox.classList.remove('hidden');
        }
      } catch(e) {
        errBox.textContent = e.message;
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
