services:
  - type: web
    name: segmentador-referidores
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        value: "1vaAwo19vbNoi-gBpIG8sNpBcsHSnXPlApenRh7iWOfI"
      - key: GOOGLE_SHEET_WORKSHEET
        value: "Seguimiento_Referidores"
